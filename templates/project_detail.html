<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Detail</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<!-- STYLES -->
<link rel="stylesheet" href="../custom.css">
</head>
<body class="vc-page">
<!-- Variant-C top bar -->
<div class="vc vc-top">
  <div class="vc-top-inner">
    <div class="vc-top-left">
      <span class="vc-brand-mark"></span>
      <span class="vc-brand-name">CLAUDE.STATS</span>
      <a href="../index.html" class="vc-back">&larr; DASHBOARD</a>
    </div>
    <div></div>
    <div class="vc-top-right">
      <button class="vc-icon-btn" id="vcThemeToggle" title="Toggle theme">&#9737;</button>
      <span class="vc-utc" id="vcUtcTime">--:--:-- UTC</span>
    </div>
  </div>
</div>

<div class="header vc">
  <h1 id="projectTitle"></h1>
</div>
<div class="container vc">
  <div class="vc-tab-h">
    <div class="vc-tab-h-title"><span id="vcProjectName">Project Detail</span></div>
    <div class="vc-tab-h-rule"></div>
    <div class="vc-tab-h-meta" id="vcProjectMeta"></div>
  </div>
  <div class="kpi-grid" id="kpiGrid"></div>
  <div class="proj-tabs">
    <button class="proj-tab active" data-tab="overview">Overview</button>
    <button class="proj-tab" data-tab="workflow">Workflow</button>
  </div>
  <div class="proj-tab-content active" id="ptab-overview">
    <div id="memorySection"></div>
    <div class="info-grid" id="infoGrid"></div>
    <div class="tools-section" id="toolsSection"><h3>Top Tools</h3><div class="tool-pills" id="toolPills"></div></div>
    <div id="skillsSection"></div>
    <div id="topFilesSection"></div>
    <h3 style="margin:24px 0 16px;font-size:15px">Sessions</h3>
    <div id="sessionFiltersMount"></div>
    <div id="sessionList"></div>
  </div>
  <div class="proj-tab-content" id="ptab-workflow">
    <div class="wf-filters" id="wfFilters"></div>
    <div class="workflow-timeline" id="workflowTimeline"></div>
  </div>
</div>
<!-- SCRIPTS -->
</body>
</html>
